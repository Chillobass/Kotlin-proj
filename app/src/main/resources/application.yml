spring:
  application:
    name: tenderhub
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tenderhub}
    username: ${DB_USER:tenderhub}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  flyway:
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

tenderhub:
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    display-name: ${ADMIN_NAME:Administrator}
  tender:
    # Deadline must be within [now + min, now + max] when a tender is submitted.
    min-deadline-offset: ${TENDER_MIN_DEADLINE_OFFSET:24h}
    max-deadline-offset: ${TENDER_MAX_DEADLINE_OFFSET:90d}
    # Time that must remain until the deadline when an admin approves the tender.
    min-open-duration: ${TENDER_MIN_OPEN_DURATION:24h}
    max-on-review-per-owner: ${TENDER_MAX_ON_REVIEW:5}
  closing:
    enabled: ${CLOSING_ENABLED:true}
    poll-interval-ms: ${CLOSING_POLL_INTERVAL_MS:10000}
    batch-size: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    root: INFO
    tenderhub: ${LOG_LEVEL:INFO}
  pattern:
    level: "%5p [%X{requestId:-}]"
